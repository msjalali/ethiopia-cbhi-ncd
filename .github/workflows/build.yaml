#
# This workflow builds the app and model-check reports, stores them in the `artifacts` branch,
# then deploys the updated `artifacts` directory to GitHub Pages.
#

name: Build

on:
  # Run this workflow on every push to any branch except the special `artifacts` branch
  push:
    branches:
      - '**'
      - '!artifacts'
  # Allow for running this workflow manually from the Actions tab
  workflow_dispatch:

# Set the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  # Allow pushing to the `artifacts` branch
  contents: write
  # Allow deployment to GitHub Pages
  pages: write
  id-token: write

# Allow one concurrent build
concurrency:
  group: 'build'

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # Check out into an `ethiopia-cbhi-ncd`-named subdirectory (see checkout step below) so
        # that relative data file paths configured in config/model.csv (which reference the
        # project folder by its local name, `ethiopia-cbhi-ncd`) resolve the same way here as
        # they do on the local development machine.
        working-directory: ethiopia-cbhi-ncd
    steps:
      - name: Check out current branch
        uses: actions/checkout@v5
        with:
          # Fetch full history for artifact branch operations
          fetch-depth: 0
          # Check out into an `ethiopia-cbhi-ncd`-named directory to match the local dev folder
          # name, since config/model.csv's data file paths are resolved relative to this name
          path: ethiopia-cbhi-ncd

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # XXX: There are issues when this GitHub Actions workflow uses the latest npm version
          # (11.6.2), see relevant issues:
          #   https://github.com/npm/cli/issues/8669
          #   https://github.com/npm/cli/issues/8726
          # For now, use the latest Node 22, which includes an older npm version that works.
          #node-version: lts/*
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ethiopia-cbhi-ncd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/ci-build.js

      - name: Check for deploy directory
        id: check-deploy
        run: |
          # Set an environment variable to true if the `deployPlugin`
          # step wrote build products.  If `deployPlugin` was disabled,
          # we will skip the remaining steps in this job (i.e., we will
          # not deploy to GitHub Pages).
          if [ -d "./sde-prep/deploy" ]; then
            echo "products_updated=true" >> $GITHUB_OUTPUT
          else
            echo "products_updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Check out artifacts branch
        if: steps.check-deploy.outputs.products_updated == 'true'
        run: git checkout artifacts

      - name: Redirect site root to the dashboard app
        if: steps.check-deploy.outputs.products_updated == 'true'
        run: |
          # The deploy plugin regenerates a "Branch Builds" index page at the site root on
          # every deploy (useful for multi-branch projects), but for this single-branch
          # dashboard we want visitors landing on the bare URL to go straight to the app.
          cat > artifacts/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=latest/" />
              <title>Ethiopia HCF Utilization Model</title>
            </head>
            <body>
              <p>Redirecting to <a href="latest/">the dashboard</a>&hellip;</p>
            </body>
          </html>
          HTML

      - name: Set up GitHub Pages
        if: steps.check-deploy.outputs.products_updated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifacts
        if: steps.check-deploy.outputs.products_updated == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: './ethiopia-cbhi-ncd/artifacts'

      - name: Deploy to GitHub Pages
        if: steps.check-deploy.outputs.products_updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
